name: CI/CD Pipeline

on:
  push:
    branches: [ lambda-test ]

# Variáveis de ambiente para o job de deploy
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cs-t1-springboot-repo
  LAMBDA_FUNCTION_NAME: lambda-cs-t1-springboot

jobs:
  # ==================================================
  # JOB 1: Build e Teste (O seu CI atual)
  # ==================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 and enable Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build, run tests, and verify coverage
        run: ./gradlew clean build jacocoTestCoverageVerification --no-daemon

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        if: always() # Garante que o report suba mesmo se o passo anterior falhar
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html

      - name: Upload Test Report (em caso de falha)
        if: failure() # Você pode usar always() se quiser o relatório mesmo se passar
        uses: actions/upload-artifact@v4
        with:
          name: test-report # Nome do arquivo que você vai baixar
          path: build/reports/tests/test/

  # ==================================================
  # JOB 2: Deploy (O nosso novo CD)
  # ==================================================
  deploy:
    name: Deploy on Lambda
    runs-on: ubuntu-latest
    
    # CONDIÇÕES PRINCIPAIS:
    # 1. 'needs' garante que o deploy só rode se o build-and-test passar
    needs: build-and-test
    # 2. 'if' garante que o deploy só rode em push (merge), não em PR
    if: github.event_name == 'push'

    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 3. Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Definir tags da imagem
        id: image-tags
        run: |
          ECR_REGISTRY_URL=${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG_SHA=$(echo $GITHUB_SHA | head -c 8)
          echo "ECR_IMAGE_URL=$ECR_REGISTRY_URL/${{ env.ECR_REPOSITORY }}" >> $GITHUB_ENV
          echo "IMAGE_TAG_SHA=$IMAGE_TAG_SHA" >> $GITHUB_ENV

      - name: 5. Build e Push da imagem para o ECR
        run: |
          docker build -t $ECR_IMAGE_URL:latest -t $ECR_IMAGE_URL:$IMAGE_TAG_SHA .
          docker push $ECR_IMAGE_URL:latest
          docker push $ECR_IMAGE_URL:$IMAGE_TAG_SHA

      - name: 6. Deploy da nova imagem no Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --image-uri $ECR_IMAGE_URL:$IMAGE_TAG_SHA
