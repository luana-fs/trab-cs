# .github/workflows/application-ci-cd.yml
name: 2 - APP (CI/CD)

on:
  push:
    branches: [ lambda-test ]
    paths-ignore:
      - 'infra/**' # Não roda se *apenas* a infra mudou
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log Level'
        required: true
        default: 'warning'
      threads:
        description: 'Number of threads'
        required: false
        default: 1


env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cs-t1-springboot-repo
  LAMBDA_FUNCTION_NAME: lambda-cs-t1-springboot

jobs:
  # ==================================================
  # JOB 1: Build e Teste (Igual ao seu)
  # ==================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # ... (todos os seus passos de build e teste - sem mudanças)
      - name: Build, run tests, and verify coverage
        run: ./gradlew clean build jacocoTestCoverageVerification --no-daemon
      # ... (upload de artifacts)

  # ==================================================
  # JOB 2: Deploy da Aplicação (Build, Push e Update)
  # ==================================================
  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: build-and-test # Depende do JOB 1
    if: github.event_name == 'push'

    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} 
          aws-region: ${{ env.AWS_REGION }}

      - name: 3. Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Definir tags da imagem
        id: image-tags
        run: |
          ECR_REGISTRY_URL=${{ steps.login-ecr.outputs.registry }}
          # Usar o SHA do commit é a melhor prática para versionar imagens
          IMAGE_TAG_SHA=$(echo $GITHUB_SHA | head -c 8)
          echo "ECR_IMAGE_URL=$ECR_REGISTRY_URL/${{ env.ECR_REPOSITORY }}" >> $GITHUB_ENV
          echo "IMAGE_TAG_SHA=$IMAGE_TAG_SHA" >> $GITHUB_ENV

      - name: 5. Build e Push da imagem para o ECR
        run: |
          docker build -t $ECR_IMAGE_URL:latest -t $ECR_IMAGE_URL:$IMAGE_TAG_SHA .
          docker push $ECR_IMAGE_URL:latest
          docker push $ECR_IMAGE_URL:$IMAGE_TAG_SHA

      # --- ESTE É O NOVO PASSO DE DEPLOY ---
      - name: 6. Atualizar o código da Função Lambda
        run: |
          echo "Atualizando ${{ env.LAMBDA_FUNCTION_NAME }} com a imagem $ECR_IMAGE_URL:$IMAGE_TAG_SHA"
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --image-uri $ECR_IMAGE_URL:$IMAGE_TAG_SHA